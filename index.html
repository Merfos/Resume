  <script>
    // Skip the intro for visitors who saw it in the last 24h (add ?intro to see it again).
    try {
      var seen = Number(localStorage.getItem("introSeenAt"));
      if (!/[?&]intro\b/.test(location.search) && seen && Date.now() - seen < 864e5) {
        document.documentElement.classList.add("no-intro");
      }
    } catch (e) {}
  </script>
